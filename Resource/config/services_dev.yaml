services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        # Bind ace_client logger to all services by default in dev environment
        bind:
            Psr\Log\LoggerInterface $logger: '@monolog.logger.ace_client'

    # Traceable Guzzle client for development profiling
    Plugin\AceClient43\Util\HttpClient\TraceableGuzzleClient:
        arguments:
            $aceConfigService: '@ace_config_service'
            $stopwatch: '@debug.stopwatch'
        lazy: true

    # ===================================================================================================
    # Traceable Serializers for Performance Monitoring
    # ===================================================================================================
    # These are the actual serializer implementations without tracing
    ace_original_soap_xml_serializer:
        class: Plugin\AceClient43\Util\Serializer\SoapXmlSerializer
        autoconfigure: false
        arguments:
            $serializer: '@soap_xml_symfony_serializer'
            $config:
                xmlns:
                    '@xmlns': 'http://ar-system-api.co.jp/'
                default_serialize_options:
                    xml_format_output: false
                    xml_encoding: 'utf-8'
                    encoder_ignored_node_types: [ 7 ]
                    skip_null_values: true
                request_soap_head: |
                    <?xml version="1.0" encoding="utf-8"?>
                    <soap12:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap12="http://www.w3.org/2003/05/soap-envelope">
                    <soap12:Body>
                request_soap_end: |
                    </soap12:Body>
                    </soap12:Envelope>

    # Traceable wrappers for serializers
    # These wrap the original serializers to add performance monitoring
    Plugin\AceClient43\Util\DataCollector\TraceableSerializer:
        public: false
        autoconfigure: false

    ace_traceable_default_serializer:
        class: Plugin\AceClient43\Util\DataCollector\TraceableSerializer
        autoconfigure: false
        public: false
        arguments:
            $serializer: '@ace_default_serializer_symfony'
            $stopwatch: '@debug.stopwatch'
            $serializerName: 'default'
        tags:
            - { name: 'ace_client.serializer', priority: 0 }

    ace_traceable_soap_xml_serializer:
        class: Plugin\AceClient43\Util\DataCollector\TraceableSerializer
        autoconfigure: false
        arguments:
            $serializer: '@ace_original_soap_xml_serializer'
            $stopwatch: '@debug.stopwatch'
            $serializerName: 'soap_xml'
        tags:
            - { name: 'ace_client.serializer', priority: 100 }

    # Override production serializer services with traceable versions
    # This makes the traceable versions available via class name
    Plugin\AceClient43\Util\Serializer\DefaultSerializer:
        alias: ace_traceable_default_serializer

    Plugin\AceClient43\Util\Serializer\SoapXmlSerializer:
        alias: ace_traceable_soap_xml_serializer

    # Data dumper utility
    Plugin\AceClient43\Util\DataCollector\DataDumper:
        public: false

    # API client data collector that filters profiler requests
    Plugin\AceClient43\Util\DataCollector\ApiClientDataCollector:
        arguments:
            $aceConfigService: '@ace_config_service'
            $dataDumper: '@Plugin\AceClient43\Util\DataCollector\DataDumper'
        tags:
            - { name: 'data_collector', template: '@AceClient43/profiler/ace_api_client.html.twig', id: 'ace_api_client' }

    # Original client services
    ace_original_post_soap_xml_client:
        class: Plugin\AceClient43\ApiClient\Client\PostSoapXmlClient
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@ace_traceable_default_serializer'
            $aceConfigService: '@ace_config_service'
        calls:
            - setExtractMaxLength: ['%ace.post_soap_client.extract_max_length%']

    ace_original_post_json_client:
        class: Plugin\AceClient43\ApiClient\Client\PostJsonClient
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@ace_traceable_default_serializer'
            $aceConfigService: '@ace_config_service'

    ace_original_get_json_client:
        class: Plugin\AceClient43\ApiClient\Client\GetJsonClient
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@ace_traceable_default_serializer'
            $aceConfigService: '@ace_config_service'

    # Traceable decorators
    ace_traceable_post_soap_xml_client:
        class: Plugin\AceClient43\Util\DataCollector\TraceableApiClient
        arguments:
            $client: '@ace_original_post_soap_xml_client'
            $stopwatch: '@debug.stopwatch'
            $collector: '@Plugin\AceClient43\Util\DataCollector\ApiClientDataCollector'
            $collectorName: 'post_soap_xml'
        tags:
            - { name: 'ace_client.api_client' }

    ace_traceable_post_json_client:
        class: Plugin\AceClient43\Util\DataCollector\TraceableApiClient
        arguments:
            $client: '@ace_original_post_json_client'
            $stopwatch: '@debug.stopwatch'
            $collector: '@Plugin\AceClient43\Util\DataCollector\ApiClientDataCollector'
            $collectorName: 'post_json'
        tags:
            - { name: 'ace_client.api_client' }

    ace_traceable_get_json_client:
        class: Plugin\AceClient43\Util\DataCollector\TraceableApiClient
        arguments:
            $client: '@ace_original_get_json_client'
            $stopwatch: '@debug.stopwatch'
            $collector: '@Plugin\AceClient43\Util\DataCollector\ApiClientDataCollector'
            $collectorName: 'get_json'
        tags:
            - { name: 'ace_client.api_client' }

    # HTTP client alias
    ace_client_http_client:
        alias: Plugin\AceClient43\Util\HttpClient\TraceableGuzzleClient
        public: false

    # Client aliases
    Plugin\AceClient43\ApiClient\Client\PostSoapXmlClient:
        alias: ace_traceable_post_soap_xml_client

    Plugin\AceClient43\ApiClient\Client\PostJsonClient:
        alias: ace_traceable_post_json_client

    Plugin\AceClient43\ApiClient\Client\GetJsonClient:
        alias: ace_traceable_get_json_client
