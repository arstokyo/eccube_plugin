# ACE API Client System Documentation
# =====================================
#
# The ACE API Client system provides a flexible, resolver-based architecture for communicating
# with the ACE API. It consists of four main components:
#
# 1. MODEL RESOLVER (ace_model_resolver)
#    - Dynamically discovers and resolves Request/Response model classes
#    - Searches in configurable paths (ace.request_search_paths, ace.response_search_paths)
#    - Supports both customization layer and plugin layer models
#    - Caches resolved models for performance
#
# 2. SERIALIZER RESOLVER (ace_serializer_resolver)
#    - Selects appropriate serializer based on API type (SOAP/REST) and format (XML/JSON)
#    - Uses priority-based selection (higher priority = preferred)
#    - SoapXmlSerializer (priority: 100) for SOAP XML requests
#    - DefaultSerializer (priority: 0) as fallback for other formats
#    - Caches serializer instances for performance
#
# 3. API CLIENT RESOLVER (ace_api_client_resolver)
#    - Selects appropriate HTTP client based on API type and format
#    - PostSoapXmlClient for SOAP XML requests (most common)
#    - PostJsonClient for REST JSON POST requests
#    - GetJsonClient for REST JSON GET requests
#    - Each client handles specific protocol requirements
#
# 4. REQUEST FLOW
#    a) Bridge layer creates Request model using ModelResolver
#    b) ApiClientResolver selects appropriate client
#    c) SerializerResolver provides serializer for request format
#    d) Client serializes request, sends HTTP request, deserializes response
#    e) Response model is returned to bridge layer
#
# This architecture allows easy extension with new API types, formats, and serializers
# without modifying existing code.

# ===================================================================================================
# ACE APIクライアントシステム ドキュメント
# ===================================================================================================
#
# ACE APIクライアントシステムは、柔軟なリゾルバーベースのアーキテクチャを採用し、
# ACE APIとの通信を効率的に行うシステムです。主に4つのコンポーネントで構成されています：
#
# 1. モデルリゾルバー (ModelResolver) - ace_model_resolver
#    ───────────────────────────────────────────────────────────────────────────────────────
#    役割：リクエスト・レスポンスモデルクラスの動的検索と解決
#    機能：
#    - 設定可能なパス（ace.request_search_paths, ace.response_search_paths）でモデルを検索
#    - カスタマイゼーション層とプラグイン層の両方をサポート
#    - パフォーマンス向上のためにモデル解決結果をキャッシュ
#    - API メソッド名から完全修飾クラス名への変換
#    例: "Member.LoginMember" → "Plugin\AceClient43\AceServices\Model\Request\Member\LoginMember\LoginMemberRequestModel"
#
# 2. シリアライザーリゾルバー (SerializerResolver) - ace_serializer_resolver
#    ───────────────────────────────────────────────────────────────────────────────────────
#    役割：APIタイプ（SOAP/REST）とフォーマット（XML/JSON）に基づく適切なシリアライザーの選択
#    機能：
#    - 優先順位ベースの選択（高い優先順位 = 優先されるシリアライザー）
#    - SoapXmlSerializer（優先順位：100）：SOAP XMLリクエスト用
#    - DefaultSerializer（優先順位：0）：その他フォーマット用フォールバック
#    - パフォーマンス向上のためにシリアライザーインスタンスをキャッシュ
#
# 3. APIクライアントリゾルバー (ApiClientResolver) - ace_api_client_resolver
#    ───────────────────────────────────────────────────────────────────────────────────────
#    役割：APIタイプとフォーマットに基づく適切なHTTPクライアントの選択
#    機能：
#    - PostSoapXmlClient：SOAP XMLリクエスト用（最も一般的）
#    - PostJsonClient：REST JSON POSTリクエスト用
#    - GetJsonClient：REST JSON GETリクエスト用
#    - 各クライアントは特定のプロトコル要件を処理
#
# 4. リクエストフロー
#    ───────────────────────────────────────────────────────────────────────────────────────
#    a) Bridgeレイヤーが ModelResolver を使用してリクエストモデルを作成
#    b) ApiClientResolver が適切なクライアントを選択
#    c) SerializerResolver がリクエストフォーマット用のシリアライザーを提供
#    d) クライアントがリクエストをシリアライズ、HTTPリクエスト送信、レスポンスをデシリアライズ
#    e) レスポンスモデルがブリッジレイヤーに返される
#
# 拡張性：
# このアーキテクチャにより、既存コードを変更することなく、新しいAPIタイプ、フォーマット、
# シリアライザーを簡単に追加できます。
# ===================================================================================================

parameters:
    ace.version: '1.1'
    ace.name: 'AceClient43'

    # Default tax display/type for processors (IDs are from master tables)
    # TaxDisplayType: 1=EXCLUDED, 2=INCLUDED
    # TaxType: 1=TAXATION, 2=NON_TAXABLE, 3=TAX_EXEMPT
    ace.processor.charge_tax_display_type: 2
    ace.processor.charge_tax_type: 1
    ace.processor.delivery_tax_display_type: 2
    ace.processor.delivery_tax_type: 1
    ace.processor.discount_tax_display_type: 2
    ace.processor.discount_tax_type: 1
    ace.processor.delivery_fee.name: '通販Ace送料'
    ace.processor.charge_fee.name: '通販Ace手数料'
    ace.processor.point_discount.name: '通販Aceポイント値引き'
    ace.processor.promotion_discount.name: '通販Aceキャンペーン値引き'

    ace.method:
        default_api_type: 'soap'
        default_request_format: 'xml'

    ace.request_search_paths:
        - 'Customize/AceClient/Model/Request'
        - 'Plugin/AceClient43/AceServices/Model/Request'

    ace.response_search_paths:
        - 'Customize/AceClient/Model/Response'
        - 'Plugin/AceClient43/AceServices/Model/Response'

    ace.dependency_search_paths:
        - 'Customize/AceClient/Model/Dependency'
        - 'Plugin/AceClient43/AceServices/Model/Dependency'

    # PRM Serialization Configuration (moved from Config.yaml)
    ace.prm_serialization:
        default_format: 'xml'
        default_options:
            xml_format_output: false
            xml_encoding: 'UTF-8'
            skip_null_values: true
        overrides:
            # Example override for specific PRM models
            # 'Plugin\AceClient43\AceServices\Model\Request\Jyuden\AddCart\OrderPrmModel':
            #   format: 'json'
            #   options:
            #     xml_format_output: true

    ace.log.max_line_length: 50000  # Maximum line length for log messages

    ace.post_soap_client.extract_max_length: 200000  # Maximum length for SOAP XML response extraction

    ace.cache.request.ttl: 300 # Request cache TTL (seconds) - 5 minutes
    ace.cache.response.ttl: 300 # Response cache TTL (seconds) - 5 minutes

    # フリー項目など：
    ace.free.ec_order_id: null
monolog:
    channels: ['ace_client', 'ace_client_console']

    handlers:
        ace_client:
            type: rotating_file
            path: '%kernel.logs_dir%/%kernel.environment%/ace_client.log'
            formatter: Plugin\AceClient43\Util\Logger\LineFormatter
            level: debug
            channels: ['ace_client']
            max_files: 60

        ace_client_console.normal_handler:
            type: console
            channels: ['ace_client_console']
            formatter: ace_client.console.normal_formatter
            process_psr_3_messages: false
            verbosity_levels:
                VERBOSITY_DEBUG: DEBUG
                VERBOSITY_VERBOSE: DEBUG
                VERBOSITY_VERY_VERBOSE: DEBUG
                VERBOSITY_NORMAL: INFO

        main:
            channels: ['!ace_client', '!ace_client_console']
        console:
            channels: ['!ace_client_console']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        # Bind ace_client logger to all services by default
        bind:
            Psr\Log\LoggerInterface $logger: '@monolog.logger.ace_client'
            Psr\Log\LoggerInterface $consoleLogger: '@monolog.logger.ace_client_console'

    # Exception: CustomerAuthenticator explicitly uses front logger
    Plugin\AceClient43\Security\Authenticator\CustomerAuthenticator:
        arguments:
            $innerAuthenticator: '@security.authenticator.form_login.customer'
            $router: '@router'
            $customerRepository: '@Eccube\Repository\CustomerRepository'
            $customerBridge: '@Plugin\AceClient43\Bridge\CustomerBridge'
            $logger: '@monolog.logger.front'  # Explicitly override to use front logger

    Plugin\AceClient43\Repository\CustomerAddressRepository:
        decorates: Eccube\Repository\CustomerAddressRepository

    # All other services will automatically use ace_client logger through _defaults bind
    Plugin\AceClient43\Bridge\BaseBridge:

    Plugin\AceClient43\Bridge\MasterBridge:
        parent: Plugin\AceClient43\Bridge\BaseBridge

    Plugin\AceClient43\Bridge\ContactBridge:
        parent: Plugin\AceClient43\Bridge\BaseBridge

    Plugin\AceClient43\Bridge\CustomerBridge:
        parent: Plugin\AceClient43\Bridge\BaseBridge

    Plugin\AceClient43\Bridge\CartBridge:
        parent: Plugin\AceClient43\Bridge\BaseBridge

    Plugin\AceClient43\Bridge\OrderBridge:
        parent: Plugin\AceClient43\Bridge\BaseBridge
        arguments:
            $purchaseFlow: '@eccube.purchase.flow.shopping'
        calls:
            - setShoppingPurchaseFlow: ['@eccube.purchase.flow.shopping']

    Plugin\AceClient43\Bridge\ProductBridge:
        lazy: true
        parent: Plugin\AceClient43\Bridge\BaseBridge
        arguments:
            $container: !service_locator
                ace_client.methods.get_goods: '@Plugin\AceClient43\AceServices\AceMethod\Goods\GetGoodsMethod'
                ace_client.methods.get_zaiko: '@Plugin\AceClient43\AceServices\AceMethod\Goods\GetZaikoMethod'
                ace_client.methods.v1_get_stock_by_update: '@Plugin\AceClient43\AceServices\AceMethod\WebApi\Goods\V1\V1GetStockByUpdateMethod'
                ace_client.methods.v1_get_goods_items: '@Plugin\AceClient43\AceServices\AceMethod\WebApi\Goods\V1\V1GoodsItemsMethod'
                ace_client.methods.v1_get_goods_items_tanka: '@Plugin\AceClient43\AceServices\AceMethod\WebApi\Goods\V1\V1GoodsItemsTankaMethod'

    # ACE Services - Version Independent Aliases (will use ace_client logger)
    ace_config_service:
        alias: Plugin\AceClient43\Service\AceConfigService
        public: true

    ace_model_resolver:
        alias: Plugin\AceClient43\Util\ModelResolver\ModelResolver
        public: false

    ace_serializer_resolver:
        alias: Plugin\AceClient43\Util\Serializer\SerializerResolver
        public: false

    ace_api_client_resolver:
        alias: Plugin\AceClient43\ApiClient\ApiClientResolver
        public: false

    # Base Guzzle HTTP Client (production)
    ace_client_http_client:
        class: GuzzleHttp\Client
        arguments:
            - base_uri: '@=service("ace_config_service").getBaseUri()'
              timeout: 600
              verify: false
              headers:
                  User-Agent: '%ace.name%V%ace.version%'
        public: false

    Plugin\AceClient43\Cache\RequestCachePool:
        arguments:
            $defaultTtl: '%ace.cache.request.ttl%'
            $isDebug: '%kernel.debug%'

    Plugin\AceClient43\Cache\ResponseCachePool:
        arguments:
            $defaultTtl: '%ace.cache.response.ttl%'

    # ===================================================================================================
    # Converter Services - Immutable Flow-Based Converters
    # ===================================================================================================

    # AddCartRequestConverter - registered with tags for auto-discovery and decoration
    # AddCartRequestConverterは自動検出とデコレーションのためにタグ付けされます
    Plugin\AceClient43\Converter\AddCartRequestConverterInterface:
        class: Plugin\AceClient43\Converter\AddCartRequestConverter

    # JyumeiDataConverter - single instance used across all flows
    # JyumeiDataConverterは全フローで共有される単一インスタンス

    # JyumeiDataConverterInterface alias for direct injection
    Plugin\AceClient43\Converter\JyumeiDataConverterInterface:
        class: Plugin\AceClient43\Converter\JyumeiDataConverter

    # AddCartRequestCorrectors - applied at the final stage of request building
    # AddCartRequestCorrectorはリクエスト構築の最終段階で適用されます

    # Default corrector (if needed) - add custom correctors with higher priority
    # Plugin\AceClient43\Converter\Corrector\DefaultAddCartRequestCorrector:
    #     tags:
    #         - { name: 'ace_client.corrector.add_cart_request', priority: 0 }

    # AddCartConverterFactory - manages converters and correctors by flow type
    # AddCartConverterFactoryはフロータイプごとにコンバータとコレクタを管理します
    Plugin\AceClient43\Converter\AddCartConverterFactory:
        arguments:
            $addCartRequestCorrectors: !tagged_iterator { tag: 'ace_client.corrector.add_cart_request' }

    # Alias for backward compatibility
    ace_add_cart_converter_factory:
        alias: Plugin\AceClient43\Converter\AddCartConverterFactory
        public: false

    # ===================================================================================================
    # コアACEサービス - リゾルバーシステム
    # ===================================================================================================

    # モデルリゾルバー - リクエスト・レスポンスモデルクラスの動的検索・解決
    # ───────────────────────────────────────────────────────────────────────────────────────
    # 動作概要：
    # - 設定されたパスでモデルを検索（カスタマイゼーション層を優先、次にプラグイン層）
    # - APIメソッド名を完全修飾クラス名に変換
    # - パフォーマンス向上のために解決されたクラス名をキャッシュ
    # - リクエストとレスポンスの両方のモデル解決をサポート
    #
    # 検索パス例：
    # リクエスト: Customize/AceClient/Model/Request → Plugin/AceClient43/AceServices/Model/Request
    # レスポンス: Customize/AceClient/Model/Response → Plugin/AceClient43/AceServices/Model/Response
    #
    # MODEL RESOLVER - Dynamically discovers and resolves Request/Response model classes
    # - Searches for models in configured paths (customization layer first, then plugin layer)
    # - Converts API method names to fully qualified class names
    # - Example: "Member.LoginMember" -> "Plugin\AceClient43\AceServices\Model\Request\Member\LoginMember\LoginMemberRequestModel"
    # - Caches resolved class names for performance
    # - Supports both Request and Response model resolution

    # -----------------------------------------------------------------------------------
    # モデルリゾルバー用キャッシュプール定義
    # -----------------------------------------------------------------------------------
    # cache.ace.model:
    #   - サービスID（プール名）: cache.ace.model
    #   - FilesystemAdapter を利用した専用プール
    #   - namespace に 'aceModelResolver' を設定し、キーの衝突を防止
    #   - %kernel.cache_dir% 配下に保存され、cache:warmup で事前構築されます
    cache.ace.model:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: 'aceModel'
            $defaultLifetime: 0
            $directory: '%kernel.cache_dir%'

    Plugin\AceClient43\Util\ModelResolver\ModelResolver:
        arguments:
            $cachePool: '@cache.ace.model'
            $requestSearchPaths: '%ace.request_search_paths%'
            $responseSearchPaths: '%ace.response_search_paths%'
            $dependencySearchPaths: '%ace.dependency_search_paths%'
        tags:
            - { name: 'ace.model_resolver' }

    Plugin\AceClient43\Service\AceConfigService:
        lazy: true

    Plugin\AceClient43\Util\Normalizer\AceDateTimeNormalizer:
        autoconfigure: false
        autowire: false
        public: false

    Plugin\AceClient43\Util\Normalizer\PrmNormalizer:
        autoconfigure: false
        arguments:
            $prmConfig: '%ace.prm_serialization%'

    # ModelTypeExtractor
    # ReflectionExtractor をサービスとして注入（final 化対策）
    Plugin\AceClient43\Util\Normalizer\ModelTypeExtractor:
        arguments:
            $modelResolver: '@ace_model_resolver'
            $reflectionExtractor: '@property_info.reflection_extractor'
        autoconfigure: false
        autowire: false
        public: false

    Plugin\AceClient43\Util\Normalizer\ModelTypeTraceableExtractor:
        autoconfigure: false

    Plugin\AceClient43\Util\Normalizer\ModelTypeExtractorInterface:
        alias: Plugin\AceClient43\Util\Normalizer\ModelTypeExtractor

    # Default AttributeLoader - used by both SOAP XML and default serializers
    default_attribute_loader:
        class: Symfony\Component\Serializer\Mapping\Loader\AttributeLoader

    # Default ChainLoader for backward compatibility
    default_chain_loader:
        class: Symfony\Component\Serializer\Mapping\Loader\LoaderChain
        arguments:
            $loaders:
                - '@default_attribute_loader'

    # Default metadata factory - used by both SOAP XML and default serializers
    default_metadata_factory:
        class: Symfony\Component\Serializer\Mapping\Factory\ClassMetadataFactory
        arguments:
            $loader: '@default_chain_loader'

    # Default name converter with metadata support
    default_name_converter:
        class: Symfony\Component\Serializer\NameConverter\MetadataAwareNameConverter
        arguments:
            $metadataFactory: '@default_metadata_factory'

    # Object Normalizer with all dependencies for SOAP XML
    soap_xml_object_normalizer:
        class: Symfony\Component\Serializer\Normalizer\ObjectNormalizer
        arguments:
            $classMetadataFactory: '@default_metadata_factory'
            $nameConverter: '@default_name_converter'
            $propertyAccessor: null
            $propertyTypeExtractor: '@Plugin\AceClient43\Util\Normalizer\ModelTypeExtractorInterface'
            $classDiscriminatorResolver: null
            $objectClassResolver: null
            $defaultContext: [ ]
        public: false
        autoconfigure: false
        autowire: false

    Plugin\AceClient43\Util\Normalizer\RemovePreserveSpaceNormalizer:
        arguments:
            $soapXmlObjectNormalizer: '@soap_xml_object_normalizer'
            $classMetadataFactory: '@default_metadata_factory'
            $nameConverter: '@default_name_converter'
            $propertyTypeExtractor: '@Plugin\AceClient43\Util\Normalizer\ModelTypeExtractorInterface'
            $classDiscriminatorResolver: null
            $objectClassResolver: null
            $defaultContext: [ ]
        autoconfigure: false
        autowire: false

    # ===================================================================================================
    # 専用Encoderインスタンス
    # ===================================================================================================
    # JsonEncoderとXmlEncoderは現在SerializerAwareInterfaceを実装していないが、
    # 各シリアライザーに専用のインスタンスを持たせることで完全な独立性を保証する。
    # これにより、将来的な変更にも対応でき、設定の明確性も向上する。

    # Default serializer用のJsonEncoder
    default_serializer_json_encoder:
        class: Symfony\Component\Serializer\Encoder\JsonEncoder
        autoconfigure: false
        autowire: false
        public: false

    # Default serializer用のXmlEncoder
    default_serializer_xml_encoder:
        class: Symfony\Component\Serializer\Encoder\XmlEncoder
        autoconfigure: false
        autowire: false
        public: false

    # SOAP XML serializer用のXmlEncoder
    soap_xml_encoder:
        class: Symfony\Component\Serializer\Encoder\XmlEncoder
        autoconfigure: false
        autowire: false
        public: false

    # ===================================================================================================
    # 専用Denormalizerインスタンス
    # ===================================================================================================
    # AsListDenormalizerとArrayDenormalizerはDenormalizerAwareInterfaceを実装しているため、
    # Symfonyのautoconfigureにより自動的に@serializerが注入されてしまう。
    # これを防ぐため、autoconfigureをfalseにして各シリアライザー専用のインスタンスを作成する。
    # Serializer::__construct()内でsetDenormalizer()が呼ばれるため、
    # 各シリアライザーは自動的に正しいdenormalizerを受け取る。

    Plugin\AceClient43\Util\Normalizer\AsListDenormalizer:
        autoconfigure: false
        autowire: false
        public: false
        arguments:
            $modelResolver: '@ace_model_resolver'

    # Default serializer用のAsListDenormalizer
    default_serializer_as_list_denormalizer:
        class: Plugin\AceClient43\Util\Normalizer\AsListDenormalizer
        autoconfigure: false
        autowire: false
        public: false
        arguments:
            $modelResolver: '@ace_model_resolver'

    # Default serializer用のArrayDenormalizer
    default_serializer_array_denormalizer:
        class: Symfony\Component\Serializer\Normalizer\ArrayDenormalizer
        autoconfigure: false
        autowire: false
        public: false

    # SOAP XML serializer用のAsListDenormalizer
    soap_xml_as_list_denormalizer:
        class: Plugin\AceClient43\Util\Normalizer\AsListDenormalizer
        autoconfigure: false
        autowire: false
        public: false
        arguments:
            $modelResolver: '@ace_model_resolver'

    # SOAP XML serializer用のArrayDenormalizer
    soap_xml_array_denormalizer:
        class: Symfony\Component\Serializer\Normalizer\ArrayDenormalizer
        autoconfigure: false
        autowire: false
        public: false

    # Dedicated Symfony Serializer for DefaultSerializer
    # Uses only specified normalizers and encoders to prevent unnecessary processing
    #
    # 重要: 完全に独立した専用インスタンスのみを使用
    # - Normalizers: 専用のAsListDenormalizer、ArrayDenormalizerを使用
    # - Encoders: 専用のJsonEncoder、XmlEncoderを使用
    #
    # DenormalizerAwareInterfaceを実装するnormalizerは、autoconfigureをfalseにすることで
    # Symfonyの@serializerではなく、このシリアライザー自身が注入される。
    # Encodersも専用インスタンスを使用することで、完全な独立性と設定の明確性を保証。
    #
    # Normalizers:
    # - default_serializer_as_list_denormalizer (Dedicated AsListDenormalizer)
    # - Plugin\AceClient43\Util\Normalizer\AceDateTimeNormalizer (Custom DateTimeNormalizer)
    # - serializer.normalizer.datetime (Symfony DateTimeNormalizer)
    # - serializer.normalizer.datetimezone (Symfony DateTimeZoneNormalizer)
    # - serializer.normalizer.dateinterval (Symfony DateIntervalNormalizer)
    # - default_serializer_array_denormalizer (Dedicated ArrayDenormalizer)
    # - default_serializer_object_normalizer (Custom ObjectNormalizer with ModelTypeExtractor)
    #
    # Encoders:

    # - default_serializer_json_encoder (Dedicated JsonEncoder)
    # - default_serializer_xml_encoder (Dedicated XmlEncoder)
    ace_default_serializer_symfony:
        class: Symfony\Component\Serializer\Serializer
        autoconfigure: false
        autowire: false
        arguments:
            $normalizers:
                - '@default_serializer_as_list_denormalizer'
                - '@Plugin\AceClient43\Util\Normalizer\AceDateTimeNormalizer'
                - '@default_serializer_array_denormalizer'
                - '@default_serializer_object_normalizer'
            $encoders:
                - '@default_serializer_json_encoder'

    # SERIALIZERS - Handle request/response serialization for different API formats
    # Priority system: Higher priority = preferred serializer for matching API type/format
    # SerializerResolver selects based on supports() method and priority
    ace_default_serializer:
        alias: Plugin\AceClient43\Util\Serializer\DefaultSerializer
        public: false

    # Dedicated Symfony Serializer for SOAP XML
    #
    # 重要: 完全に独立した専用インスタンスのみを使用
    # - Normalizers: 専用のAsListDenormalizer、ArrayDenormalizerを使用
    # - Encoder: 専用のXmlEncoderを使用
    #
    # DenormalizerAwareInterfaceを実装するnormalizerは、autoconfigureをfalseにすることで
    # Symfonyの@serializerではなく、このシリアライザー自身が注入される。
    # Encoderも専用インスタンスを使用することで、完全な独立性と設定の明確性を保証。
    #
    # Normalizers:
    # - soap_xml_as_list_denormalizer (Dedicated AsListDenormalizer)
    # - Plugin\AceClient43\Util\Normalizer\RemovePreserveSpaceNormalizer (Custom XML Normalizer)
    # - Plugin\AceClient43\Util\Normalizer\AceDateTimeNormalizer (Custom DateTimeNormalizer)
    # - Plugin\AceClient43\Util\Normalizer\PrmNormalizer (Custom PRM Normalizer)
    # - soap_xml_object_normalizer (Custom ObjectNormalizer)
    # - soap_xml_array_denormalizer (Dedicated ArrayDenormalizer)
    #
    # Encoders:
    # - soap_xml_encoder (Dedicated XmlEncoder)
    soap_xml_symfony_serializer:
        class: Symfony\Component\Serializer\Serializer
        autoconfigure: false
        autowire: false
        lazy: true
        arguments:
            $normalizers:
                - '@soap_xml_as_list_denormalizer'
                - '@Plugin\AceClient43\Util\Normalizer\RemovePreserveSpaceNormalizer'
                - '@Plugin\AceClient43\Util\Normalizer\AceDateTimeNormalizer'
                - '@Plugin\AceClient43\Util\Normalizer\PrmNormalizer'
                - '@soap_xml_array_denormalizer'
                - '@soap_xml_object_normalizer'
            $encoders:
                - '@soap_xml_encoder'

    Plugin\AceClient43\Util\DataCollector\TraceableSerializer:
        public: false
        autoconfigure: false

    # ===================================================================================================
    # Default Serializer Configuration
    # ===================================================================================================
    # Custom ObjectNormalizer for default serializer with ModelTypeExtractor
    # Uses our custom ModelTypeExtractor instead of Symfony's default property type extractor
    # This ensures proper type resolution for ACE API models
    default_serializer_object_normalizer:
        class: Symfony\Component\Serializer\Normalizer\ObjectNormalizer
        arguments:
            $classMetadataFactory: '@default_metadata_factory'
            $nameConverter: '@default_name_converter'
            $propertyAccessor: null
            $propertyTypeExtractor: '@Plugin\AceClient43\Util\Normalizer\ModelTypeExtractorInterface'
            $classDiscriminatorResolver: null
            $objectClassResolver: null
            $defaultContext: []
        public: false
        autoconfigure: false
        autowire: false

    ace_soap_xml_serializer:
        alias: Plugin\AceClient43\Util\Serializer\SoapXmlSerializer
        public: false

    # DefaultSerializer - Fallback serializer for non-SOAP requests (priority: 0)
    # Uses custom Symfony serializer with only specified normalizers and encoders
    # Handles JSON and other standard formats
    Plugin\AceClient43\Util\Serializer\DefaultSerializer:
        arguments:
            $symfonySerializer: '@ace_default_serializer_symfony'
        tags:
            - { name: 'ace_client.serializer', priority: 0 }

    # SoapXmlSerializer - Specialized serializer for SOAP XML requests (priority: 100)
    # Wraps request data in SOAP envelope with proper namespaces
    # Handles ACE-specific XML structure and diffgr namespaces
    # Extracts response data from SOAP envelope for deserialization
    Plugin\AceClient43\Util\Serializer\SoapXmlSerializer:
        lazy: true
        arguments:
            $serializer: '@soap_xml_symfony_serializer'
            $config:
                xmlns:
                    '@xmlns': 'http://ar-system-api.co.jp/'
                default_serialize_options:
                    xml_format_output: false
                    xml_encoding: 'utf-8'
                    encoder_ignored_node_types: [ 7 ]
                    skip_null_values: true
                request_soap_head: |
                    <?xml version="1.0" encoding="utf-8"?>
                    <soap12:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap12="http://www.w3.org/2003/05/soap-envelope">
                    <soap12:Body>
                request_soap_end: |
                    </soap12:Body>
                    </soap12:Envelope>
        tags:
            - { name: 'ace_client.serializer', priority: 100 }

    # ===================================================================================================
    # APIクライアント - 異なるプロトコル・フォーマット用のHTTPクライアント
    # ===================================================================================================

    # PostSoapXmlClient - SOAP XMLリクエスト用クライアント（最も一般的）
    # ───────────────────────────────────────────────────────────────────────────────────────
    # - SOAP 1.2プロトコルでHTTP POSTリクエストを送信
    # - Content-Type: application/soap+xml を設定
    # - SOAPエンベロープの作成と解析を処理
    # - ACE APIの主要なインターフェース
    Plugin\AceClient43\ApiClient\Client\PostSoapXmlClient:
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@serializer'
            $aceConfigService: '@ace_config_service'
        calls:
            - setExtractMaxLength: ['%ace.post_soap_client.extract_max_length%']
            - setRequestCachePool: [ '@Plugin\AceClient43\Cache\RequestCachePool' ]
        tags:
            - { name: 'ace_client.api_client' }

    # PostJsonClient - REST JSON POSTリクエスト用クライアント
    # ───────────────────────────────────────────────────────────────────────────────────────
    # - Content-Type: application/json でHTTP POSTリクエストを送信
    # - REST API エンドポイント用
    Plugin\AceClient43\ApiClient\Client\PostJsonClient:
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@serializer'
            $aceConfigService: '@ace_config_service'
        tags:
            - { name: 'ace_client.api_client' }

    # GetJsonClient - REST JSON GETリクエスト用クライアント
    # ───────────────────────────────────────────────────────────────────────────────────────
    # - HTTP GETリクエストでデータを取得
    # - クエリパラメータ経由でパラメータを送信
    # - 読み取り専用操作用
    Plugin\AceClient43\ApiClient\Client\GetJsonClient:
        arguments:
            $serializerResolver: '@ace_serializer_resolver'
            $httpClient: '@ace_client_http_client'
            $normalizer: '@serializer'
            $aceConfigService: '@ace_config_service'
        tags:
            - { name: 'ace_client.api_client' }

    # ===================================================================================================
    # リゾルバーサービス - コンポーネント選択システム
    # ===================================================================================================

    # ApiClientResolver - APIタイプ・フォーマットに基づく適切なHTTPクライアントの選択
    # ───────────────────────────────────────────────────────────────────────────────────────
    # 選択ロジック：
    # - 登録されたすべてのクライアントのsupports()メソッドをチェック
    # - APIタイプ（soap/rest）とフォーマット（xml/json）の組み合わせで判定
    # - 最初にマッチしたクライアントを返す
    Plugin\AceClient43\ApiClient\ApiClientResolver:
        arguments:
            $clients: !tagged_iterator { tag: 'ace_client.api_client' }

    # SerializerResolver - APIタイプ・フォーマットに基づく適切なシリアライザーの選択
    # ───────────────────────────────────────────────────────────────────────────────────────
    # 選択ロジック：
    # - 登録されたすべてのシリアライザーのsupports()メソッドをチェック
    # - 優先順位の高いシリアライザーを優先して選択
    # - APIタイプとフォーマットの組み合わせで判定
    # - パフォーマンス向上のために選択結果をキャッシュ
    Plugin\AceClient43\Util\Serializer\SerializerResolver:
        lazy: true
        arguments:
            $serializers: !tagged_iterator { tag: 'ace_client.serializer' }

    # -----------------------------------------------------------------------------------
    # キャッシュウォーマー登録
    # -----------------------------------------------------------------------------------
    # 目的:
    # - キャッシュウォームアップ時にモデル解決結果を cache.ace.model へ事前投入
    # - 実行時の初回モデル探索コストを削減
    #
    # 補足:
    # - isOptional() = true により、ウォームアップ失敗でもデプロイを阻害しません
    Plugin\AceClient43\Util\ModelResolver\ModelResolverWarmer:
        arguments:
            $resolver: '@Plugin\AceClient43\Util\ModelResolver\ModelResolver'
            $requestSearchPaths: '%ace.request_search_paths%'
            $responseSearchPaths: '%ace.response_search_paths%'
            $dependencySearchPaths: '%ace.dependency_search_paths%'
        tags:
            - { name: kernel.cache_warmer }

    # Processors - will use ace_client logger
    Plugin\AceClient43\Processor\ChargeProcessor:
        arguments:
            $taxDisplayTypeId: '@=container.hasParameter("ace.processor.charge_tax_display_type") ? parameter("ace.processor.charge_tax_display_type") : 2'
            $taxTypeId: '@=container.hasParameter("ace.processor.charge_tax_type") ? parameter("ace.processor.charge_tax_type") : 1'
            $itemName: '@=container.hasParameter("ace.processor.charge_fee.name") ? parameter("ace.processor.charge_fee.name") : null'
        tags:
            - { name: eccube.item.holder.preprocessor, flow_type: shopping, priority: 550 }

    # since we move class from service/processor to processor/charge, so we should add migration to update the class name on database
    Plugin\AceClient43\Processor\DeliveryFeeProcessor:
        arguments:
            $taxDisplayTypeId: '@=container.hasParameter("ace.processor.delivery_tax_display_type") ? parameter("ace.processor.delivery_tax_display_type") : 2'
            $taxTypeId: '@=container.hasParameter("ace.processor.delivery_tax_type") ? parameter("ace.processor.delivery_tax_type") : 1'
            $itemName: '@=container.hasParameter("ace.processor.delivery_fee.name") ? parameter("ace.processor.delivery_fee.name") : null'
        tags:
            - { name: eccube.item.holder.preprocessor, flow_type: shopping, priority: 750 }

    # Eccubeの既存ポイントを削除
    Plugin\AceClient43\Processor\PrePointDiscountProcessor:
        tags:
            - { name: eccube.discount.processor, flow_type: shopping, priority: 910 }
            - { name: eccube.discount.processor, flow_type: order, priority: 910 }

    # 通販Aceのポイント値引きを追加のプロセッサー
    Plugin\AceClient43\Processor\PointDiscountProcessor:
        arguments:
            $taxDisplayTypeId: '@=container.hasParameter("ace.processor.discount_tax_display_type") ? parameter("ace.processor.discount_tax_display_type") : 1'
            $taxTypeId: '@=container.hasParameter("ace.processor.discount_tax_type") ? parameter("ace.processor.discount_tax_type") : 1'
            $itemName: '@=container.hasParameter("ace.processor.point_discount.name") ? parameter("ace.processor.point_discount.name") : null'
        tags:
            - { name: eccube.discount.processor, flow_type: shopping, priority: 900 }
            - { name: eccube.discount.processor, flow_type: order, priority: 900 }

    # 受注サポートによるキャンペーン値引きなどを追加プロセッサー
    Plugin\AceClient43\Processor\PromotionDiscountProcessor:
        arguments:
            $taxDisplayTypeId: '@=container.hasParameter("ace.processor.discount_tax_display_type") ? parameter("ace.processor.discount_tax_display_type") : 1'
            $taxTypeId: '@=container.hasParameter("ace.processor.discount_tax_type") ? parameter("ace.processor.discount_tax_type") : 1'
            $itemName: '@=container.hasParameter("ace.processor.promotion_discount.name") ? parameter("ace.processor.promotion_discount.name") : null'
        tags:
            - { name: eccube.item.holder.preprocessor, flow_type: shopping, priority: 600 }

    # ACE AddPointProcessor - 加算ポイント（ACE連携）
    Plugin\AceClient43\Processor\AddPointProcessor:
        tags:
            - { name: eccube.item.holder.post.validator, flow_type: shopping, priority: 850 }
            - { name: eccube.item.holder.post.validator, flow_type: order, priority: 9500 }

    # Decorators
    Plugin\AceClient43\Comparator\ProductClassComparator:
        decorates: Eccube\Service\Cart\ProductClassComparator
        decoration_priority: 10

    Plugin\AceClient43\Service\Decorators\CartService:
        decorates: Eccube\Service\CartService
        arguments:
            $cartItemComparator: '@Plugin\AceClient43\Comparator\ProductClassComparator'
        decoration_priority: 10

    Plugin\AceClient43\Service\Decorators\OrderHelper:
        decorates: Eccube\Service\OrderHelper
        decoration_priority: 10

    # Logger
    Plugin\AceClient43\Util\Logger\LineFormatter:
        arguments:
            $format: "[%%datetime%%] %%channel%%.%%level_name%% [%%extra.session_id%%] [%%extra.uid%%] [%%extra.user_id%%] [%%extra.class%%:%%extra.function%%:%%extra.line%%] - %%message%% %%context%% [%%extra.http_method%%, %%extra.url%%, %%extra.ip%%, %%extra.referrer%%, %%extra.user_agent%%]\n"
            $maxLineLength: '%ace.log.max_line_length%'
        tags:
            - { name: 'monolog.formatter', channel: 'ace_client' }

    ace_client.console.normal_formatter:
        class: Symfony\Bridge\Monolog\Formatter\ConsoleFormatter
        arguments:
            - { format: "[%%datetime%%] %%level_name%% %%start_tag%%%%message%%%%end_tag%% %%context%%\n" }

    Plugin\AceClient43\Command\ProductImportCommand:
    Plugin\AceClient43\Command\ProductRepeatImportCommand:
    Plugin\AceClient43\Command\ImportProductStockCommand:

security:
    firewalls:
        customer:
            custom_authenticators:
                - Plugin\AceClient43\Security\Authenticator\CustomerAuthenticator
            entry_point: Plugin\AceClient43\Security\Authenticator\CustomerAuthenticator
